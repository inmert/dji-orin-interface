[package]
name = "dji-orin-interface"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Control a DJI Matrice 210 V1 from a Jetson Orin by speaking the controller's DUML protocol over USB"

# No external dependencies: the USB/gadget plumbing uses the system libc via
# hand-declared externs, so the project builds fully offline.

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
borrow_as_ptr = "warn"
ptr_as_ptr = "warn"
cast_lossless = "warn"
format_collect = "warn"

[profile.release]
opt-level = 2
